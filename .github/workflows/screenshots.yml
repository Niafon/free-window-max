name: Real-data screenshots
# Captures a real search (KudaGo photos + Yandex routes) from the deployed server and commits the PNGs to the branch.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployed HTTPS origin with YANDEX_MAPS_KEY
        default: https://77-91-95-175.sslip.io
permissions:
  contents: write
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
        env:
          SCREENSHOT_URL: ${{ inputs.url || 'https://77-91-95-175.sslip.io' }}
      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/real-*.png
          git diff --cached --quiet && exit 0
          git commit -m 'Real-data screenshots from the deployed server'
          git push origin HEAD:${{ github.ref_name }}
