name: free-window-max
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: okno
      POSTGRES_USER: okno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okno_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U okno -d okno]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://okno:${POSTGRES_PASSWORD:-okno_local_only}@db:5432/okno
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      MAX_MODE: ${MAX_MODE:-off}
    ports:
      - 127.0.0.1:${PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
